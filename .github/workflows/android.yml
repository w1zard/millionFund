name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Environment
        run: |
          node -v
          npm -v
          java -version
          javac -version

      - name: Check Capacitor Versions
        run: |
          echo "===== ANDROID ====="
          npm view @capacitor/android versions --json

          echo "===== CORE ====="
          npm view @capacitor/core versions --json

          echo "===== CLI ====="
          npm view @capacitor/cli versions --json

          echo "===== APP ====="
          npm view @capacitor/app versions --json

          echo "===== FILESYSTEM ====="
          npm view @capacitor/filesystem versions --json

      - name: Show package.json
        run: |
          cat package.json

      - name: Install Dependencies
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
